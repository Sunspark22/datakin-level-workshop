name: Editor checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python checks (ROM-dependent checks skip without a game)
        run: python -m unittest discover -s tests -v
      - name: Browser model checks
        run: node tests/model.mjs
      - name: Browser syntax checks
        run: node --check web/app.js
      - name: Build ROM-free download
        run: python build_release.py
